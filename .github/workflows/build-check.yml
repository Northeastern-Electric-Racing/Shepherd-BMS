name: Build
on: [push]
jobs:
  run-build:
    runs-on: ubuntu-latest
    container:
        image: ghcr.io/northeastern-electric-racing/embedded-base:main
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Execute Make
        run: docker compose run --rm ner-gcc-arm make -j `nproc`
